<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WigglyPaint</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{
    display:flex;flex-direction:column;overflow:hidden;
    background:#ececf1;color:#1c1c22;
    font-family:"Arial Rounded MT Bold","Helvetica Rounded","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  #main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;padding:14px}
  #canvasWrap{position:relative;line-height:0;background:repeating-conic-gradient(#d7d7e0 0% 25%, #c9c9d4 0% 50%) 0 0/20px 20px;border-radius:3px}
  canvas#cv{display:block;touch-action:none;box-shadow:0 6px 28px rgba(20,20,40,.22)}
  #cropRect{position:absolute;border:2px dashed #4361ee;background:rgba(67,97,238,.14);display:none;pointer-events:none}
  #cropHint{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:#1c1c22;color:#fff;font-size:13px;font-weight:700;
    padding:8px 16px;border-radius:99px;display:none;z-index:5;white-space:nowrap;
  }
  #brushes{
    width:78px;flex:none;background:#fff;border-left:1px solid #dddde6;
    display:flex;flex-direction:column;align-items:center;gap:11px;padding:16px 8px;overflow-y:auto;
  }
  .brushBtn{
    width:52px;height:52px;flex:none;border-radius:50%;cursor:pointer;
    border:3px solid transparent;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,border-color .12s;padding:0;
  }
  .brushBtn:hover{transform:scale(1.08)}
  .brushBtn.selected{border-color:#1c1c22;transform:scale(1.1)}
  .brushBtn svg{width:26px;height:26px}
  #bottombar{
    flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fff;border-top:1px solid #dddde6;padding:10px 14px;
  }
  .funcBtn{
    font-family:inherit;font-weight:800;font-size:15px;letter-spacing:.06em;
    padding:10px 18px;border-radius:12px;border:2px solid #1c1c22;background:#fff;color:#1c1c22;
    cursor:pointer;transition:.12s;
  }
  .funcBtn:hover{background:#f0f0f6}
  .funcBtn.active{background:#1c1c22;color:#fff}
  .funcBtn.primary{background:#4361ee;border-color:#4361ee;color:#fff}
  .funcBtn.primary:hover{background:#3553d8}
  #sizeWrap{display:flex;align-items:center;gap:12px;margin-left:auto}
  #sizeDot{border-radius:50%;background:#1c1c22;flex:none;transition:width .1s,height .1s}
  input[type=range]{width:150px;accent-color:#4361ee;cursor:pointer}
  #eraseWrap{display:flex;gap:8px}
  .iconBtn{
    width:46px;height:46px;border-radius:12px;border:2px solid #1c1c22;background:#fff;color:#1c1c22;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;padding:0;
  }
  .iconBtn:hover{background:#f0f0f6}
  .iconBtn.active{background:#1c1c22;color:#fff}
  .iconBtn svg{width:22px;height:22px}
  .modal{position:fixed;inset:0;background:rgba(20,20,35,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modalCard{background:#fff;border-radius:18px;padding:24px;width:min(440px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.35);max-height:88vh;overflow-y:auto}
  .modalCard h2{margin:0 0 16px;font-size:20px;letter-spacing:.04em}
  .modalCard h3{margin:18px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#777}
  .modalCard h3:first-of-type{margin-top:0}
  .modalCard input[type=text]{width:100%;padding:11px 13px;border:2px solid #dddde6;border-radius:12px;font-size:15px;font-family:inherit;outline:none}
  .modalCard input[type=text]:focus{border-color:#4361ee}
  .modalBtns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .optRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{
    font-family:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;
    border:2px solid #dddde6;background:#fff;cursor:pointer;transition:.12s;
  }
  .chip:hover{border-color:#1c1c22}
  .chip.active{border-color:#1c1c22;background:#1c1c22;color:#fff}
  .chip.checker{background:repeating-conic-gradient(#d7d7e0 0% 25%, #fff 0% 50%) 0 0/14px 14px}
  .chip.checker.active{background:repeating-conic-gradient(#d7d7e0 0% 25%, #fff 0% 50%) 0 0/14px 14px;color:#1c1c22;border-color:#4361ee}
  input[type=color]{width:44px;height:36px;border:2px solid #dddde6;border-radius:10px;background:#fff;cursor:pointer;padding:2px}
  .paletteBtn{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;margin-bottom:8px;
    border:2px solid #dddde6;border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:14px;transition:.12s;
  }
  .paletteBtn:hover{border-color:#1c1c22}
  .paletteBtn.active{border-color:#4361ee}
  .paletteBtn .dots{display:flex;gap:4px;margin-left:auto}
  .paletteBtn .dots i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
  .modalCard .row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .modalCard .row label{flex:1;font-size:14px;font-weight:700}
  .modalCard .val{font-size:12px;background:#eeeef4;padding:3px 9px;border-radius:8px;min-width:58px;text-align:center;font-weight:700}
  .modalCard input[type=range]{flex:1.2}
  .modalCard .check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;margin:4px 0 2px}
  .modalCard .check input{accent-color:#4361ee;width:17px;height:17px}
  .bar{height:12px;background:#eeeef4;border-radius:99px;overflow:hidden;margin:16px 0 8px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4361ee,#f72585);transition:width .15s}
  #barTxt{text-align:center;font-weight:700;color:#555;margin:0}
  #toast{
    position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(14px);
    background:#1c1c22;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:700;
    opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){
    #main{flex-direction:column}
    #brushes{width:100%;flex-direction:row;border-left:none;border-top:1px solid #dddde6;padding:10px;overflow-x:auto;overflow-y:hidden}
    .brushBtn{width:46px;height:46px}
    input[type=range]{width:100px}
    .funcBtn{padding:9px 12px;font-size:13px}
  }
</style>
</head>
<body>

<div id="main">
  <div id="stage">
    <div id="cropHint">Glissez pour sélectionner la zone à conserver — Échap pour annuler</div>
    <div id="canvasWrap">
      <canvas id="cv" width="1000" height="700"></canvas>
      <div id="cropRect"></div>
    </div>
  </div>
  <div id="brushes"></div>
</div>

<div id="bottombar">
  <button class="funcBtn" id="btnExport">EXPORT</button>
  <button class="funcBtn" id="btnCrop">CROP</button>
  <button class="funcBtn" id="btnOptions">OPTIONS</button>
  <button class="funcBtn" id="btnOops">OOPS</button>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700" for="toolColor">Couleur
    <input type="color" id="toolColor" value="#1c1c1c" title="Couleur de l’outil sélectionné" aria-label="Couleur de l’outil sélectionné" />
  </label>
  <div id="sizeWrap">
    <span id="sizeDot"></span>
    <input type="range" id="rngSize" min="1" max="24" value="6" />
  </div>
  <div id="eraseWrap">
    <button class="iconBtn" id="btnEraser" title="Gomme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </button>
    <button class="iconBtn" id="btnClear" title="Tout effacer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>
</div>

<div class="modal" id="exportModal">
  <div class="modalCard">
    <h2>Exporter</h2>
    <input type="text" id="fileName" value="wigglypaint.gif" />
    <div class="modalBtns">
      <button class="funcBtn" id="btnCancelExport">Annuler</button>
      <button class="funcBtn primary" id="btnDoExport">Sauvegarder</button>
    </div>
  </div>
</div>

<div class="modal" id="optionsModal">
  <div class="modalCard">
    <h2>Options</h2>

    <h3>Arrière-plan</h3>
    <div class="optRow" id="bgChoices">
      <button class="chip active" data-bg="#ffffff" style="background:#ffffff">Blanc</button>
      <button class="chip" data-bg="#141414" style="background:#141414;color:#fff">Noir</button>
      <button class="chip" data-bg="paper" style="background:#f6f1e3">Papier</button>
      <button class="chip checker" data-bg="transparent">Transparent</button>
      <input type="color" id="bgCustom" value="#ffe8a3" title="Couleur personnalisée" />
    </div>

    <h3>Animation</h3>
    <div class="row">
      <label for="optAmp">Tremblement</label>
      <input type="range" id="optAmp" min="0" max="8" step="0.5" value="3.5" />
      <span class="val" id="optAmpVal">3.5</span>
    </div>
    <div class="row">
      <label for="optSpeed">Vitesse</label>
      <input type="range" id="optSpeed" min="4" max="24" value="12" />
      <span class="val" id="optSpeedVal">12 img/s</span>
    </div>
    <label class="check"><input type="checkbox" id="optAnim" checked /> Animer les traits</label>

    <h3>Canevas</h3>
    <div class="optRow">
      <span id="sizeLabel" class="chip" style="cursor:default">1000 × 700</span>
      <button class="chip" id="btnResetSize">Restaurer la taille d'origine</button>
      <button class="chip" id="btnFullscreen">Plein écran</button>
    </div>

    <h3>Palette de pinceaux</h3>
    <div id="paletteList"></div>

    <div class="modalBtns">
      <button class="funcBtn primary" id="btnCloseOptions">Fermer</button>
    </div>
  </div>
</div>

<div class="modal" id="progressModal">
  <div class="modalCard">
    <h2>Export du GIF…</h2>
    <div class="bar"><i id="barFill"></i></div>
    <p id="barTxt">0 %</p>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js" type="text/javascript"></script>
<script type="text/javascript">
(function(){
'use strict';

/* ================= État ================= */
var ORIG_W = 1000, ORIG_H = 700;
var W = ORIG_W, H = ORIG_H;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var layer = document.createElement('canvas'); layer.width = W; layer.height = H;
var lctx = layer.getContext('2d');
var stage = document.getElementById('stage');
var cropRect = document.getElementById('cropRect');
var cropHint = document.getElementById('cropHint');

var ICON_MARKER = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
var ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
var ICON_BRUSH  = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>';
var ICON_SPRAY  = '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="6" cy="6" r="1.6"/><circle cx="11" cy="4.5" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="8.5" cy="10" r="1.6"/><circle cx="14" cy="10.5" r="1.6"/><circle cx="6.5" cy="14.5" r="1.6"/><circle cx="12" cy="15" r="1.6"/><circle cx="17.5" cy="14" r="1.6"/><circle cx="9.5" cy="19" r="1.6"/><circle cx="15" cy="19.5" r="1.6"/></svg>';
var ICON_NEON   = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>';
var ICON_RAINBOW= '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 20a9 9 0 0 1 18 0"/><path d="M7.5 20a4.5 4.5 0 0 1 9 0"/><path d="M12 20v-4"/></svg>';
var ICON_DOTS   = '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>';
var ICON_STAR   = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>';
var ICON_NIB    = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 3 5 6.5 5 10a5 5 0 0 1-10 0c0-3.5 2-7 5-10z"/><circle cx="12" cy="13" r="1.6"/></svg>';
var ICON_BUCKET = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>';

var BRUSHES = [
  { name:'Marqueur noir',   color:'#1c1c1c', width:1.0,  style:'marker',      wiggle:1.0, icon:ICON_MARKER },
  { name:'Marqueur rouge',  color:'#e63946', width:1.0,  style:'marker',      wiggle:1.0, icon:ICON_MARKER },
  { name:'Marqueur bleu',   color:'#4361ee', width:1.0,  style:'marker',      wiggle:1.0, icon:ICON_MARKER },
  { name:'Marqueur vert',   color:'#2a9d8f', width:1.0,  style:'marker',      wiggle:1.0, icon:ICON_MARKER },
  { name:'Marqueur orange', color:'#f4842b', width:1.0,  style:'marker',      wiggle:1.0, icon:ICON_MARKER },
  { name:'Marqueur violet', color:'#7209b7', width:1.0,  style:'marker',      wiggle:1.0, icon:ICON_MARKER },
  { name:'Crayon',          color:'#6c757d', width:0.55, style:'crayon',      wiggle:1.4, icon:ICON_PENCIL },
  { name:'Pinceau',         color:'#f72585', width:1.4,  style:'brush',       wiggle:0.8, icon:ICON_BRUSH },
  { name:'Spray',           color:'#5b8e7d', width:1.6,  style:'spray',       wiggle:1.2, icon:ICON_SPRAY },
  { name:'Néon',            color:'#00b4d8', width:0.8,  style:'neon',        wiggle:1.0, icon:ICON_NEON },
  { name:'Arc-en-ciel',     color:'#ff5d8f', width:1.0,  style:'rainbow',     wiggle:1.0, icon:ICON_RAINBOW, rainbow:true },
  { name:'Pointillé',       color:'#e07a5f', width:1.0,  style:'dots',        wiggle:1.0, icon:ICON_DOTS },
  { name:'Tampon étoile',   color:'#f2b705', width:1.2,  style:'stamp',       wiggle:1.0, icon:ICON_STAR },
  { name:'Calligraphie',    color:'#3d405b', width:1.1,  style:'calligraphy', wiggle:0.9, icon:ICON_NIB },
  { name:'Seau',            color:'#b23a48', width:1.0,  style:'bucket',      wiggle:1.0, icon:ICON_BUCKET }
];

var PALETTES = [
  { name:'Classique', colors:['#1c1c1c','#e63946','#4361ee','#2a9d8f','#f4842b','#7209b7','#6c757d','#f72585','#5b8e7d','#00b4d8','#ff5d8f','#e07a5f','#f2b705','#3d405b','#b23a48'] },
  { name:'Pastel',    colors:['#3a3a3a','#ff8fa3','#8ecae6','#95d5b2','#ffc8a2','#cdb4db','#9d9d9d','#ffb3c6','#a8d5ba','#ffd6ff','#ffc6ff','#ffadad','#fdffb6','#bdb2ff','#ff9aa2'] },
  { name:'Néon',      colors:['#ffffff','#ff0054','#00f5d4','#fee440','#ff9e00','#9b5de5','#8d99ae','#f15bb5','#39ff14','#00ffff','#ff00ff','#ff6b35','#ffff00','#c77dff','#ff1493'] },
  { name:'Terre',     colors:['#3d405b','#9a3412','#2f5233','#b08968','#d4a373','#6d597a','#8a817c','#bc6c25','#a98467','#e9c46a','#cb997e','#6b705c','#dda15e','#606c38','#9d4e2e'] }
];

var strokes = [];
var history = [];
var redoStack = [];
var current = null;
var selectedBrush = 0;
var eraserMode = false;
var markerSize = 6;
var bg = '#ffffff';
var cropMode = false, cropStart = null, lastP = null;
var wiggleAmp = 3.5, tickMs = 1000 / 12, tickCount = 0, animEnabled = true;

function $(id){ return document.getElementById(id); }
function rand(a){ return (Math.random() * 2 - 1) * a; }
function srand(seed){ var x = Math.sin(seed) * 43758.5453; return x - Math.floor(x); }

/* ================= Tremblement ================= */
function newJitter(s){
  var a = wiggleAmp * s.wiggle, pa = a * 0.15, pts = [], i;
  for (i = 0; i < s.points.length; i++) pts.push({ x: rand(pa), y: rand(pa) });
  return {
    f1: 0.012 + Math.random() * 0.012, p1: Math.random() * Math.PI * 2,
    f2: 0.035 + Math.random() * 0.03,  p2: Math.random() * Math.PI * 2,
    f3: 0.08 + Math.random() * 0.07,   p3: Math.random() * Math.PI * 2,
    p4: Math.random() * Math.PI * 2,   p5: Math.random() * Math.PI * 2,
    pts: pts
  };
}
function computeStrokeGeometry(s){
  var pts = s.points, n = pts.length, i;
  s.dist = []; s.norm = []; s.tan = [];
  var d = 0;
  for (i = 0; i < n; i++){
    if (i > 0) d += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    s.dist.push(d);
  }
  for (i = 0; i < n; i++){
    var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    var tx = b.x - a.x, ty = b.y - a.y;
    var len = Math.hypot(tx, ty);
    if (len < 1e-6){ tx = 1; ty = 0; len = 1; }
    tx /= len; ty /= len;
    s.tan.push({ x: tx, y: ty });
    s.norm.push({ x: -ty, y: tx });
  }
}

/* ================= Dessin des traits ================= */
function tracePath(c, jp){
  c.beginPath();
  c.moveTo(jp[0].x, jp[0].y);
  for (var i = 1; i < jp.length - 1; i++){
    var mx = (jp[i].x + jp[i+1].x) / 2, my = (jp[i].y + jp[i+1].y) / 2;
    c.quadraticCurveTo(jp[i].x, jp[i].y, mx, my);
  }
  c.lineTo(jp[jp.length-1].x, jp[jp.length-1].y);
}
function drawMarker(c, jp, s){
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = s.color; c.lineWidth = s.size;
  if (jp.length === 1){
    c.beginPath(); c.arc(jp[0].x, jp[0].y, s.size / 2, 0, Math.PI * 2);
    c.fillStyle = s.color; c.fill(); return;
  }
  tracePath(c, jp); c.stroke();
}
function drawCrayon(c, jp, s){
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = s.color; c.lineWidth = s.size;
  c.globalAlpha = 0.5;
  var offs = [[0,0],[1.6,-1.1],[-1.6,1.1]], k, i;
  for (k = 0; k < offs.length; k++){
    var ox = offs[k][0], oy = offs[k][1];
    if (jp.length === 1){
      c.beginPath(); c.arc(jp[0].x + ox, jp[0].y + oy, s.size / 2, 0, Math.PI * 2); c.fillStyle = s.color; c.fill();
      continue;
    }
    c.beginPath(); c.moveTo(jp[0].x + ox, jp[0].y + oy);
    for (i = 1; i < jp.length - 1; i++){

/* ================= Rendu ================= */
function paintBg(c){
  if (bg === 'transparent') return;
  if (bg === 'paper'){
    c.fillStyle = '#f6f1e3'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(90,80,50,.15)'; c.lineWidth = 1; c.beginPath();
    for (var gx = 32; gx < W; gx += 32){ c.moveTo(gx, 0); c.lineTo(gx, H); }
    for (var gy = 32; gy < H; gy += 32){ c.moveTo(0, gy); c.lineTo(W, gy); }
    c.stroke();
    return;
  }
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
}
function render(){
  lctx.clearRect(0, 0, W, H);
  var list = current ? strokes.concat([current]) : strokes;
  for (var i = 0; i < list.length; i++) drawStroke(lctx, list[i]);
  ctx.clearRect(0, 0, W, H);
  paintBg(ctx);
  ctx.drawImage(layer, 0, 0);
}
var lastTick = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (animEnabled && now - lastTick >= tickMs){
    lastTick = now;
    tickCount++;
    for (var i = 0; i < strokes.length; i++) strokes[i].j = newJitter(strokes[i]);
    if (current) current.j = newJitter(current);
  }
  render();
}
requestAnimationFrame(frame);

/* ================= Mise à l'échelle du canevas ================= */
function fitCanvas(){
  var pad = 28;

  var scale = Math.min(availW / W, availH / H);

  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
function updateSizeLabel(){ $('sizeLabel').textContent = W + ' × ' + H; }
function resetCanvasSize(){
  W = ORIG_W; H = ORIG_H;
  cv.width = W; cv.height = H;
  layer.width = W; layer.height = H;
  fitCanvas();
  updateSizeLabel();
}

/* ================= Pointeur ================= */
function pos(e){
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function startStroke(p){
  var b = BRUSHES[selectedBrush];
  current = {
    points: [p],
    color: b.color,
    size: eraserMode ? markerSize * 3 : markerSize * b.width,
    style: eraserMode ? 'marker' : b.style,
    wiggle: eraserMode ? 1 : b.wiggle,
    erase: eraserMode,
    seed: Math.random() * 1000,
    j: null

  current.j = newJitter(current);
}
function showCropRect(a, b){
  var rx = Math.min(a.x, b.x), ry = Math.min(a.y, b.y);
  var rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
  var sx = cv.clientWidth / W, sy = cv.clientHeight / H;
  cropRect.style.display = 'block';
  cropRect.style.left = (rx * sx) + 'px';
  cropRect.style.top = (ry * sy) + 'px';
  cropRect.style.width = (rw * sx) + 'px';
  cropRect.style.height = (rh * sy) + 'px';
}
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  var p = pos(e);
  lastP = p;
  if (cropMode){ cropStart = p; showCropRect(p, p); return; }
  if (!eraserMode && BRUSHES[selectedBrush].style === 'bucket'){ doFill(p); return; }
  startStroke(p);
});
cv.addEventListener('pointermove', function(e){
  var p = pos(e);
  lastP = p;
  if (cropMode && cropStart){ showCropRect(cropStart, p); return; }
  if (!current) return;
  var l = current.points[current.points.length - 1];
  if (Math.hypot(p.x - l.x, p.y - l.y) < 1.5) return;

function endPointer(){
  if (cropMode && cropStart && lastP){
    var rx = Math.min(cropStart.x, lastP.x), ry = Math.min(cropStart.y, lastP.y);
    var rw = Math.abs(lastP.x - cropStart.x), rh = Math.abs(lastP.y - cropStart.y);
    cropStart = null;
    cropRect.style.display = 'none';
    if (rw >= 20 && rh >= 20) applyCrop(rx, ry, rw, rh);
    return;
  }
  if (current){
    strokes.push(current);
    history.push({ type:'stroke', stroke: current });
    redoStack.length = 0;
    current = null;

cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

/* ================= CROP ================= */
function applyCrop(rx, ry, rw, rh){
  var margin = 80, kept = [], i, j, inside, s;
  for (i = 0; i < strokes.length; i++){
    s = strokes[i];
    if (s.style === 'fill'){
      inside = false;
      for (j = 0; j < s.runs.length; j++){
        var run = s.runs[j];
        if (run[1] >= ry - margin && run[1] <= ry + rh + margin && run[0] + run[2] >= rx - margin && run[0] <= rx + rw + margin){ inside = true; break; }
      }
      if (inside){
        s.runs = s.runs.map(function(r){ return [r[0] - rx, r[1] - ry, r[2]]; });
        s.anchor = { x:s.anchor.x-rx, y:s.anchor.y-ry };
        s.support = null; s.fillKey = null; s.liveRuns = null;
        s.j = null;
        kept.push(s);
      }
      continue;
    }
    inside = false;
    for (j = 0; j < s.points.length; j++){
      var p = s.points[j];
      if (p.x >= rx - margin && p.x <= rx + rw + margin && p.y >= ry - margin && p.y <= ry + rh + margin){ inside = true; break; }
    }
    if (inside) kept.push(s);
  }
  strokes = kept;
  for (i = 0; i < strokes.length; i++){
    s = strokes[i];
    if (s.style === 'fill') continue;
    s.points = s.points.map(function(p){ return { x: p.x - rx, y: p.y - ry }; });
    computeStrokeGeometry(s);
    s.j = null;
  }
  W = Math.round(rw); H = Math.round(rh);
  cv.width = W; cv.height = H;
  layer.width = W; layer.height = H;
  fitCanvas();
  updateSizeLabel();

  toast('Zone recadrée — taille restaurable dans OPTIONS');
}
function setCropMode(on){
  cropMode = on;
  $('btnCrop').classList.toggle('active', on);

  cv.style.cursor = on ? 'crosshair' : '';
  if (!on){ cropStart = null; cropRect.style.display = 'none'; }
}
$('btnCrop').onclick = function(){ setCropMode(!cropMode); };

/* ================= Pinceaux ================= */
var brushesEl = $('brushes');
BRUSHES.forEach(function(b, i){
  var btn = document.createElement('button');
  btn.className = 'brushBtn' + (i === 0 ? ' selected' : '');
  btn.style.background = b.rainbow ? 'linear-gradient(120deg,#ff5d8f,#f2b705,#2a9d8f,#4361ee,#7209b7)' : b.color;
  btn.title = b.name;
  btn.dataset.i = i;
  btn.innerHTML = b.icon;
  btn.onclick = function(){ selectBrush(i); };
  brushesEl.appendChild(btn);
});
function selectBrush(i){
  selectedBrush = i;
  eraserMode = false;
  $('btnEraser').classList.remove('active');
  var all = brushesEl.querySelectorAll('.brushBtn');
  for (var j = 0; j < all.length; j++) all[j].classList.toggle('selected', j === i);
  updateSizeDot();
}
$('btnEraser').onclick = function(){
  eraserMode = !eraserMode;
  $('btnEraser').classList.toggle('active', eraserMode);
  var all = brushesEl.querySelectorAll('.brushBtn');
  for (var j = 0; j < all.length; j++) all[j].classList.toggle('selected', !eraserMode && j === selectedBrush);
  updateSizeDot();
};
$('toolColor').addEventListener('input', function(e){
  var b = BRUSHES[selectedBrush];
  b.color = e.target.value;
  brushesEl.children[selectedBrush].style.background = b.color;
  updateSizeDot();
});
$('rngSize').addEventListener('input', function(e){ markerSize = +e.target.value; updateSizeDot(); });
function updateSizeDot(){
  $('toolColor').value = BRUSHES[selectedBrush].color;
  $('toolColor').disabled = eraserMode || !!BRUSHES[selectedBrush].rainbow;
  var d = markerSize * (eraserMode ? 3 : BRUSHES[selectedBrush].width);
  var dot = $('sizeDot');
  var px = Math.max(5, d * 1.7);
  dot.style.width = px + 'px';
  dot.style.height = px + 'px';
  dot.style.background = eraserMode ? '#bbb' : BRUSHES[selectedBrush].color;
}

/* ================= OOPS / Effacer ================= */
function undo(){
  var a = history.pop();
  if (!a) return;
  if (a.type === 'stroke'){
    strokes = strokes.filter(function(s){ return s !== a.stroke; });
  } else if (a.type === 'clear'){
    strokes = a.strokes;
  }
  redoStack.push(a);
}
function redo(){
  var a = redoStack.pop();
  if (!a) return;
  if (a.type === 'stroke') strokes.push(a.stroke);
  else if (a.type === 'clear'){ a.strokes = strokes; strokes = []; }
  history.push(a);
}
$('btnOops').onclick = undo;
$('btnClear').onclick = function(){
  if (!strokes.length) return;
  history.push({ type:'clear', strokes: strokes });
  strokes = [];
  redoStack.length = 0;
};

/* ================= Modales ================= */
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(function(m){
  m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('show'); });
});

/* ---------- EXPORT ---------- */
$('btnExport').onclick = function(){ openModal('exportModal'); $('fileName').focus(); };
$('btnCancelExport').onclick = function(){ closeModal('exportModal'); };
$('btnDoExport').onclick = function(){
  var name = $('fileName').value.trim() || 'wigglypaint.gif';
  if (!/\.gif$/i.test(name)) name += '.gif';
  closeModal('exportModal');
  exportGIF(name);
};
function showProgress(on){ $('progressModal').classList.toggle('show', on); if (on) setProgress(0); }
function setProgress(p){
  $('barFill').style.width = Math.round(p * 100) + '%';
  $('barTxt').textContent = Math.round(p * 100) + ' %';
}
function download(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}
async function exportGIF(filename){
  if (typeof GIF === 'undefined'){ toast('Export GIF indisponible hors ligne'); return; }
  var fps = 12, frames = 24;
  showProgress(true);
  var ec = document.createElement('canvas'); ec.width = W; ec.height = H;
  var e2 = ec.getContext('2d');
  var el = document.createElement('canvas'); el.width = W; el.height = H;
  var elx = el.getContext('2d');
  var workerScript;
  try {
    var r = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
    workerScript = URL.createObjectURL(new Blob([await r.text()], { type:'application/javascript' }));
  } catch(err){
    workerScript = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
  }
  var gif = new GIF({
    workers: 2, quality: 12, width: W, height: H,
    workerScript: workerScript,
    background: bg === 'transparent' ? '#ffffff' : undefined
  });
  for (var i = 0; i < frames; i++){
    for (var j = 0; j < strokes.length; j++) strokes[j].j = newJitter(strokes[j]);
    elx.clearRect(0, 0, W, H);
    for (var k = 0; k < strokes.length; k++) drawStroke(elx, strokes[k]);
    e2.clearRect(0, 0, W, H);
    paintBg(e2);
    e2.drawImage(el, 0, 0);
    gif.addFrame(e2, { copy: true, delay: Math.round(1000 / fps) });
    setProgress((i + 1) / frames);
    await new Promise(function(res){ setTimeout(res, 0); });
  }
  gif.on('finished', function(blob){
    download(blob, filename);
    showProgress(false);
    toast('GIF exporté !');
  });
  gif.render();
}

/* ---------- OPTIONS ---------- */
$('btnOptions').onclick = function(){ updateSizeLabel(); openModal('optionsModal'); };
$('btnCloseOptions').onclick = function(){ closeModal('optionsModal'); };
var bgChips = document.querySelectorAll('#bgChoices .chip');
bgChips.forEach(function(chip){
  chip.onclick = function(){
    bg = chip.getAttribute('data-bg');
    bgChips.forEach(function(x){ x.classList.toggle('active', x === chip); });
  };
});
$('bgCustom').addEventListener('input', function(e){
  bg = e.target.value;
  bgChips.forEach(function(x){ x.classList.remove('active'); });
});
$('optAmp').addEventListener('input', function(e){
  wiggleAmp = +e.target.value;
  $('optAmpVal').textContent = wiggleAmp;
});
$('optSpeed').addEventListener('input', function(e){
  var v = +e.target.value;
  tickMs = 1000 / v;
  $('optSpeedVal').textContent = v + ' img/s';
});
$('optAnim').addEventListener('change', function(e){ animEnabled = e.target.checked; });
$('btnResetSize').onclick = function(){ resetCanvasSize(); toast('Taille d’origine restaurée'); };
$('btnFullscreen').onclick = function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
var paletteList = $('paletteList');
PALETTES.forEach(function(pal, pi){
  var b = document.createElement('button');
  b.className = 'paletteBtn' + (pi === 0 ? ' active' : '');
  var dots = pal.colors.map(function(c){ return '<i style="background:' + c + '"></i>'; }).join('');
  b.innerHTML = '<span>' + pal.name + '</span><span class="dots">' + dots + '</span>';
  b.onclick = function(){
    pal.colors.forEach(function(c, i){ BRUSHES[i].color = c; });
    var all = brushesEl.querySelectorAll('.brushBtn');
    for (var i = 0; i < all.length; i++){ if (!BRUSHES[i].rainbow) all[i].style.background = BRUSHES[i].color; }
    var pbs = paletteList.querySelectorAll('.paletteBtn');
    for (var j = 0; j < pbs.length; j++) pbs[j].classList.toggle('active', j === pi);
    updateSizeDot();
  };
  paletteList.appendChild(b);
});

/* ================= Toast ================= */
var toastTimer;
function toast(msg){
  var t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

/* ================= Clavier ================= */
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape'){
    if (cropMode) setCropMode(false);
    document.querySelectorAll('.modal.show').forEach(function(m){ m.classList.remove('show'); });
    return;
  }
  if (tag === 'input' || tag === 'textarea') return;
  var k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); }
});
document.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(){ b.blur(); });
});

/* ================= Démarrage ================= */
fitCanvas();
updateSizeDot();
updateSizeLabel();

})();
</script>
